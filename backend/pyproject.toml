[project]
name = "tutor-os-py"
version = "0.1.0"
description = "Tutor OS backend — agents, tools, and memory over FastAPI"
readme = "README.md"
license = "MIT"
authors = [{ name = "Matheus Buniotto" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.28.1",
    "pydantic-ai-harness[skills]>=0.27.0",
]

[project.urls]
Repository = "https://github.com/matheusbuniotto/aio-learn"

[project.scripts]
tutor-os-py = "tutor_os:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.6",
]

[tool.uv.build-backend]
module-name = "tutor_os"

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# `llm` evals call a real model gateway: opt in with `uv run pytest -m llm`.
addopts = "-m 'not llm' --strict-markers"
markers = [
    "llm: requires a real model gateway (costs tokens, non-deterministic)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# too-many-nested-blocks is a preview rule; agent prompt/instruction strings
# are long natural-language prose by design, so E501 is intentionally
# excluded below rather than reflowed.
preview = true

[tool.ruff.lint]
select = [
    "E4",      # import placement/shadowing
    "E7",      # statement errors (bare except, lambda assignment, etc.)
    "E9",      # runtime errors (syntax, undefined names)
    "F",       # pyflakes
    "I",       # import sorting
    "UP",      # pyupgrade
    "B",       # bugbear (common bugs / footguns)
    "SIM",     # simplify
    "C4",      # comprehensions
    "RUF",     # ruff-specific
    "C90",     # mccabe cyclomatic complexity
    "too-many-return-statements",
    "too-many-branches",
    "too-many-arguments",
    "too-many-statements",
    "too-many-nested-blocks",
    "magic-value-comparison",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-branches = 12
max-returns = 6
max-args = 6
max-statements = 50
max-nested-blocks = 4

[tool.ruff.lint.per-file-ignores]
# tools/*.py functions are pydantic-ai Tool schemas: their kwargs ARE the
# LLM-facing tool-call interface, so argument count reflects that contract,
# not internal complexity. PLR0913 stays enforced everywhere else.
"src/tutor_os/tools/*.py" = ["too-many-arguments"]

# Accepted complexity backlog — fix opportunistically when a change touches
# these functions for real, rather than as a drive-by refactor.
"src/tutor_os/tools/research.py" = [
    "complex-structure",
    "too-many-branches",
    "too-many-nested-blocks",
    "magic-value-comparison",
]
"src/tutor_os/tools/page_index.py" = ["complex-structure", "too-many-nested-blocks"]

# Asserting on a literal status code or count IS the test — naming those
# constants would just move the expected value out of the assertion.
"tests/**" = ["magic-value-comparison"]
# conftest.py must set TUTOR_OS_ROOT before anything imports tutor_os.
"tests/conftest.py" = ["module-import-not-at-top-of-file"]

[tool.ty.rules]
possibly-missing-attribute = "warn"
