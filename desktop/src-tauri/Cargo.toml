[package]
name = "tutor-os"
version = "0.1.0"
description = "Tutor OS desktop shell"
edition = "2021"

[lib]
name = "tutor_os_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.5", features = [] }

[dependencies]
tauri = { version = "2.2.4", features = [] }
tauri-plugin-shell = "2"
serde_json = "1.0"

# Keep release builds and target/ small: no incremental cache, one codegen
# unit, symbols stripped.
[profile.release]
incremental = false
codegen-units = 1
lto = true
strip = true
opt-level = "s"
