name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: uv lock check
        run: uv lock --check

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: ty check
        run: uvx ty check --project .

      # Covers the import smoke test: tests/ imports tutor_os.server.
      # LLM evals are excluded by the `-m 'not llm'` default in pyproject.toml.
      - name: pytest
        run: uv run pytest -q
