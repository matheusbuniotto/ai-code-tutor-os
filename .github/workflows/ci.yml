name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  py:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: py
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: uv lock check
        run: uv lock --check

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: ty check
        run: uvx ty check --project .

      - name: import smoke test
        env:
          OPENAI_API_KEY: ci-smoke-test-dummy-key
        run: uv run python -c "import tutor_os.server"
