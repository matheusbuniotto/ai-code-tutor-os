[project]
name = "tutor-os-py"
version = "0.1.0"
description = "Tutor OS backend — pydantic-ai 2.0 port of src/mastra + src/server.ts"
readme = "README.md"
license = "MIT"
authors = [{ name = "Matheus Buniotto" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.28.1",
    "pydantic-ai-harness[skills]>=0.27.0",
]

[project.urls]
Repository = "https://github.com/matheusbuniotto/aio-learn"

[project.scripts]
tutor-os-py = "tutor_os:main"

[dependency-groups]
dev = ["ruff>=0.16.6"]

[tool.uv.build-backend]
module-name = "tutor_os"

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
# too-many-nested-blocks is a preview rule; agent prompt/instruction strings
# are long natural-language prose by design, so E501 is intentionally
# excluded below rather than reflowed.
preview = true

[tool.ruff.lint]
select = [
    "E4",      # import placement/shadowing
    "E7",      # statement errors (bare except, lambda assignment, etc.)
    "E9",      # runtime errors (syntax, undefined names)
    "F",       # pyflakes
    "I",       # import sorting
    "UP",      # pyupgrade
    "B",       # bugbear (common bugs / footguns)
    "SIM",     # simplify
    "C4",      # comprehensions
    "RUF",     # ruff-specific
    "C90",     # mccabe cyclomatic complexity
    "too-many-return-statements",
    "too-many-branches",
    "too-many-arguments",
    "too-many-statements",
    "too-many-nested-blocks",
    "magic-value-comparison",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-branches = 12
max-returns = 6
max-args = 6
max-statements = 50
max-nested-blocks = 4

[tool.ruff.lint.per-file-ignores]
# tools/*.py functions are pydantic-ai Tool schemas: their kwargs ARE the
# LLM-facing tool-call interface, so argument count reflects that contract,
# not internal complexity. PLR0913 stays enforced everywhere else.
"src/tutor_os/tools/*.py" = ["too-many-arguments"]

# Pre-existing complexity/magic-value debt, accepted backlog (see
# py/NEXT-PHASES.md's "Migration gotchas" section) — fix opportunistically
# if a future change touches these functions for real, rather than as a
# drive-by refactor here.
"src/tutor_os/tools/research.py" = [
    "complex-structure",
    "too-many-branches",
    "too-many-nested-blocks",
    "magic-value-comparison",
]
"src/tutor_os/tools/page_index.py" = ["complex-structure", "too-many-nested-blocks"]
"src/tutor_os/tools/meta.py" = [
    "complex-structure",
    "too-many-branches",
    "too-many-statements",
]
"src/tutor_os/tools/gate.py" = ["magic-value-comparison"]

[tool.ty.rules]
# Start permissive; tighten once the full agent roster is ported.
possibly-missing-attribute = "warn"
