[project]
name = "tutor-os-py"
version = "0.1.0"
description = "Tutor OS backend — pydantic-ai 2.0 port of src/mastra + src/server.ts"
readme = "README.md"
authors = []
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.28.1",
    "pydantic-ai-harness[skills]>=0.27.0",
]

[project.scripts]
tutor-os-py = "tutor_os:main"

[tool.uv.build-backend]
module-name = "tutor_os"

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
# PLR1702 (too-many-nested-blocks) is a preview rule; agent prompt/instruction
# strings are long natural-language prose (often Portuguese) by design, so
# E501 is intentionally excluded below rather than reflowed.
preview = true

[tool.ruff.lint]
select = [
    "E4",      # import placement/shadowing
    "E7",      # statement errors (bare except, lambda assignment, etc.)
    "E9",      # runtime errors (syntax, undefined names)
    "F",       # pyflakes
    "I",       # import sorting
    "UP",      # pyupgrade
    "B",       # bugbear (common bugs / footguns)
    "SIM",     # simplify
    "C4",      # comprehensions
    "RUF",     # ruff-specific
    "C90",     # mccabe cyclomatic complexity
    "PLR0911", # too many return statements
    "PLR0912", # too many branches
    "PLR0913", # too many arguments
    "PLR0915", # too many statements
    "PLR1702", # too many nested blocks
    "PLR2004", # magic value comparison
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-branches = 12
max-returns = 6
max-args = 6
max-statements = 50
max-nested-blocks = 4

[tool.ruff.lint.per-file-ignores]
# tools/*.py functions are pydantic-ai Tool schemas: their kwargs ARE the
# LLM-facing tool-call interface, so argument count reflects that contract,
# not internal complexity. PLR0913 stays enforced everywhere else.
"src/tutor_os/tools/*.py" = ["PLR0913"]

[tool.ty.rules]
# Start permissive; tighten once the full agent roster is ported.
possibly-missing-attribute = "warn"
